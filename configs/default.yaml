# Конфигурация сервиса подсчёта деталей на конвейере.
# Все координаты по оси X нормированы в [0, 1] относительно ширины кадра.
# Конвейер движется СПРАВА НАЛЕВО.

# Классы деталей. Для добавления новой детали — добавить новый класс
# с текстовыми промптами для zero-shot разметки.
classes:
  floor_panel:
    prompts:
      - "stamped sheet metal panel"
      - "large metal plate"
      - "car floor panel"

# Извлечение кадров из видео для разметки.
frames:
  stride: 5              # брать каждый N-й кадр
  dedup_threshold: 4.0   # средняя попиксельная разница; меньше — кадр-дубликат (пролаг), пропускаем
  max_frames: 2000       # ограничение на количество извлечённых кадров

# Zero-shot разметка (YOLO-World по текстовым промптам).
autolabel:
  model: "yolov8l-worldv2.pt"
  confidence: 0.25
  min_box_area: 0.01     # доля площади кадра; отсечь мелкий мусор
  max_box_area: 0.95     # отсечь рамку на весь кадр
  max_detections_per_frame: 3
  val_split: 0.2         # доля кадров в валидацию

# Обучение YOLO11.
train:
  model: "yolo11n.pt"    # n/s/m/l/x — по доступному железу
  epochs: 100
  imgsz: 640
  batch: 16
  patience: 20
  device: ""             # "" = авто, "0" = первая GPU, "cpu"

# Виртуальная модель конвейера.
conveyor:
  spawn_zone_x: 0.72        # детекция правее этой линии создаёт новый экземпляр детали
  count_line_x: 0.18        # пересечение этой линии = деталь засчитана
  match_gate: 0.18          # макс. расстояние влево для сопоставления детекции с экземпляром
  right_tolerance: 0.04     # допуск дрожания вправо; правее — детекция считается пролагом и игнорируется
  min_spawn_separation: 0.25  # не создавать новый экземпляр, если рядом уже есть существующий
  max_missed_frames: 60     # столько кадров без детекций до линии = деталь убрали с ленты (брак, не считаем)
  max_coast_frames: 25      # если линия пересечена «накатом» (без свежих детекций) позже этого срока — не считаем
  velocity_smoothing: 0.3   # EMA-сглаживание скорости экземпляра
  default_velocity: -0.004  # стартовая скорость (норм. ширина кадра за кадр), пока скорость ленты не оценена

# Подсчёт и хранение.
counting:
  min_confidence: 0.35      # порог уверенности YOLO11 при подсчёте
  db_path: "data/counts.sqlite3"
